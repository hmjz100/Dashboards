		return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
			const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15;
			const v = c === 'x' ? r : (r & 0x3 | 0x8);
			return v.toString(16);
		});
	});

	function UUID(text) {
		if (text == null) return crypto.randomUUID();
		let hash = Array.from(new TextEncoder().encode(String(text))).reduce((h, c) => Math.imul(h ^ c, 0x5bd1e995) >>> 0, 0x811c9dc5);
		return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
			const r = (hash & 0xf);
			hash = hash >> 4;

			--card: #ffffff;
			--text: #1d1d1f;
			--border: #d2d2d7;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--background: #242424;

				--text: #f5f5f7;
				--border: #38383a;

		}

		*,
		:after,
		:before {
			box-sizing: border-box;
		}

		html,
		body {
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-size: inherit;
		}

		body {
			font-family: -apple-system, sans-serif;
			background-color: var(--background);
			color: var(--text);
			margin: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.icon {
			width: 16px;
			height: 16px;
			fill: currentColor;
			flex-shrink: 0;
		}

		.container {
			width: 100%;
			max-width: 900px;
		}

		.container #dashboards {
			display: grid;
			gap: 20px;
			overflow: auto;
			max-height: 80vh;
		}

		#dashboards .card {
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 16px;
			padding: 20px;
			cursor: pointer;
			transition: all 0.2s ease;
			display: flex;
			align-items: center;
			gap: 15px;
			color: var(--text) !important;
			text-decoration: none !important;
		}

		#dashboards .card:hover {
			border-color: var(--primary);
		}

		#dashboards .card img {
			width: 48px;
			height: 48px;
			border-radius: 10px;
			object-fit: contain;
		}

		#dashboards .card .info h3 {
			margin: 0;
			font-size: 1.1rem;
		}

		#dashboards .card .info p {
			margin: 5px 0 0;
			font-size: 0.85rem;
			opacity: 0.6;
			word-break: normal;
			overflow-wrap: break-word;
		}

		.overlay {
			display: none;
			position: fixed;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.5);
			z-index: 999;
			justify-content: center;
			align-items: center;
			backdrop-filter: blur(5px);
		}

		.modal {
			display: flex;
			flex-direction: column;
			position: relative;
			gap: 1vh;
			position: fixed;
			z-index: 1000;
			background: var(--card);
			width: 90%;
			max-width: 400px;
			max-height: 60%;
			border-radius: 16px;
			padding: 20px;
			overflow-y: auto;
			box-shadow: 0 0 4px #00000024, 0 4px 8px #00000047;
			border: 1px solid var(--border);
		}

		.modal>.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.modal>.header h2 {
			margin: 0;
		}

		.modal>.header>.close {
			background: none;
			border: none;
			color: var(--text);
			font-size: 24px;
			cursor: pointer;
		}

		.modal .servers {
			display: grid;
			gap: 10px;
			overflow: auto;
			max-height: 50%;
		}

		.modal .servers>.item {
			display: grid;
			gap: 10px;
			background: var(--background);
			border: 1px solid var(--border);
			padding: 15px;
			border-radius: 12px;
		}

		.modal .servers>.item input[type="text"] {
			width: 100%;
			padding: 10px;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--card);
			color: var(--text);
			box-sizing: border-box;
		}

		.modal .servers>.item>.actions {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.modal>.actions {
			display: grid;
			gap: 10px;
			position: sticky;
			bottom: 0;
			width: 100%;
			background: var(--card);
		}

		.btn {
			display: inline-flex;
			gap: 3px;
			align-items: center;
			justify-content: center;
			padding: 8px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			line-height: 1;
			vertical-align: middle;
		}

		.btn.primary {
			background: var(--primary);
			color: white;
		}

		.btn.danger {
			background: var(--danger);
			color: white;
		}

		.btn.success {
			background: var(--success);
			color: white;
		}

		.dash {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			z-index: 99;
			background: var(--background);
		}

		.dash iframe {
			width: 100%;
			height: 100%;
			border: none;
		}

		.fab {
			display: flex;
			align-items: center;
			justify-content: center;
			position: fixed;
			right: 20px;
			bottom: 20px;
			width: 48px;
			height: 48px;
			color: white;
			background: var(--primary);
			border-radius: 50%;
			box-shadow: 0 0 4px #00000024, 0 4px 8px #00000047;
			transition: transform 0.1s;
			border: none;
			cursor: pointer;
			user-select: none;
			touch-action: none;
		}

		.fab>.icon {
			width: 24px;
			height: 24px;
		}

		.fab.grab {
			background: rgba(255, 59, 48, 0.9);
			cursor: grab;
		}

		.fab.grab:active {
			cursor: grabbing;
			transform: scale(0.95);
		}

				<button class="btn primary add">
					<svg class="icon">
						<use href="#icon-fa-plus"></use>
					</svg>
					<span>添加服务器</span>
				</button>
				<button class="btn success save">
					<svg class="icon">
						<use href="#icon-fa-check"></use>
					</svg>
					<span>保存并同步</span>
				</button>
				<button class="btn danger reset">
					<svg class="icon">
						<use href="#icon-fa-x-mark"></use>
					</svg>
					<span>清空并重置</span>
				</button>
			</div>
		</div>
	</div>

	<div class="dash">
		<iframe></iframe>
		<div class="fab close" style="z-index: 99; top:auto; bottom: 50%; left: auto; right: 20px;">
			<svg class="icon">
				<use href="#icon-fa-x-mark"></use>
			</svg>
		</div>
	</div>

	<script>
		// 全局状态
		let state = {
			servers: [],
			isParasitism: false
		};

		const Core = {
			// 初始化配置
			async init() {
				const config = localStorage.getItem(MAIN);
				let localData = this.getSyncData();

				if (config) {
					state = JSON.parse(config);
					if (!localData) this.sync(); // 如果主配置有但子面板没数据，同步过去
				} else if (localData) {
					state.servers = localData; // 如果主配置空但子面板有，拉取回来
					this.save();
				} else {
					await this.detect(); // 都没有则尝试自动探测
				}

				UI.renderList();
				Event.bindDrag();
			},

			// 探测本地 Clash 服务
			async detect() {
				const host = `${location.protocol}//${location.host}`;
				try {
					const res = await fetch(`${host}/version`);
					if (res.status === 401) return UI.openSettings(host); // 需要密码
					const data = await res.json();
					if (data?.meta && data?.version) {
						state.isParasitism = true;
						state.servers = [{ id: UUID(), name: location.host, url: host, secret: "", default: true }];
						this.save();
						this.sync();
						alert("已自动识别并连接本地 Clash 服务");
					}
				} catch (e) { /* ignore */ }
			},

			// 保存到当前主配置
			save() {
				localStorage.setItem(MAIN, JSON.stringify(state));
			},

			// 同步到所有子面板的 Storage
			sync() {
				DASHBOARDS.forEach(d => {
					try { d.config.save(state.servers); } catch (e) { }
				});
			},

			// 从子面板尝试读取已有的配置（取第一个有值的）
			getSyncData() {
				for (let d of DASHBOARDS) {
					let data = d.config.read();
					if (data?.length > 0) return data;
				}
				return null;
			}
		};

		const UI = {
			elm: {
				dash: $("body>.dash"),
				settings: $("body>.settings"),
				cards: $("body>.container>#dashboards")
			},

			renderList() {
				// 渲染主页卡片
				const cards = DASHBOARDS.map((item, i) => `
				<div class="card" onclick="UI.openDash(${i})">
					<img src="${new URL(`./${item.folder}/${item.icon}`, location.href).href}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/124/124037.png'">
					<div class="info"><h3>${item.name}</h3><p>${item.desc}</p></div>
				</div>`).join("");
				this.elm.cards.html(cards);
			},

			openDash(index) {
				const dash = DASHBOARDS[index];
				dash.config.save(state.servers); // 打开前强制同步一次
				this.elm.dash.find("iframe").attr("src", `./${dash.folder}/`);
				this.elm.dash.fadeIn(200);
				document.title = dash.name;

				// 轮询：如果 iframe 内部改了配置，同步出来
				this.poll = setInterval(() => {
					const current = JSON.stringify(dash.config.read());
					if (current !== JSON.stringify(state.servers)) {
						state.servers = JSON.parse(current);
						Core.save();
						Core.sync();
					}
				}, 1000);
			},

			closeDash() {
				clearInterval(this.poll);
				this.elm.dash.fadeOut(200, () => this.elm.dash.find("iframe").attr("src", ""));
				document.title = "Dashboards";
			},

			openSettings(prefill = "") {
				if (state.servers.length === 0) {
					state.servers.push({ id: UUID(), name: "", url: prefill || "http://localhost:9090", secret: "", default: true });
				}
				this.renderServerItems();
				this.elm.settings.css("display", "flex");
			},

			renderServerItems() {
				const html = state.servers.map((s, i) => `
				<div class="item" data-id="${s.id}">
					<input type="text" class="s-url" placeholder="URL" value="${s.url}">
					<input type="text" class="s-secret" placeholder="Secret" value="${s.secret}">
					<div class="actions">
						<label><input type="radio" name="def" ${s.default ? 'checked' : ''}> 默认</label>
						<button class="btn danger" onclick="UI.removeServer(${i})"><svg class="icon"><use href="#icon-fa-x-mark"></use></svg>删除</button>
					</div>
				</div>`).join("");
				this.elm.settings.find(".servers").html(html);
			},

			removeServer(i) {
				state.servers.splice(i, 1);
				this.renderServerItems();
			}
		};

		const Event = {
			init() {
				// 基础按钮事件
				$(".fab.settings").on("click", () => UI.openSettings());
				UI.elm.settings.find(".close").on("click", () => UI.elm.settings.hide());
				$(".btn.add").on("click", () => {
					state.servers.push({ id: UUID(), url: "", secret: "", default: false });
					UI.renderServerItems();
				});

				// 保存逻辑
				$(".btn.save").on("click", () => {
					let newServers = [];
					UI.elm.settings.find(".servers>.item").each(function (i) {
						const url = $(this).find(".s-url").val();
						if (!url) return;
						newServers.push({
							id: state.servers[i]?.id || UUID(),
							name: url.split('//')[1] || url,
							url: url,
							secret: $(this).find(".s-secret").val(),
							default: $(this).find("input[name='def']").is(":checked")
						});
					});
					state.servers = newServers;
					Core.save();
					Core.sync();
					UI.elm.settings.hide();
					alert("配置已同步");
				});

				// 重置
				$(".btn.reset").on("click", () => {
					if (confirm("确定清空所有配置？")) {
						localStorage.removeItem(MAIN);
						state.servers = [];
						Core.sync();
						location.reload();
					}
				});

				// 窗口缩放边界处理
				window.addEventListener('resize', () => {
					if (UI.elm.dash.is(":visible")) this.keepInBounds();
				});
			},

			// 拖拽逻辑保持独立
			bindDrag() {
				let btn = UI.elm.dash.find(".fab.close")[0];
				let isMoving = false, startX, startY, initialX, initialY;

				const start = (e) => {
					isMoving = false;
					let ev = e.type.includes('mouse') ? e : e.touches[0];
					startX = ev.clientX; startY = ev.clientY;
					const rect = btn.getBoundingClientRect();
					initialX = rect.left; initialY = rect.top;
					UI.elm.dash.find("iframe").css("pointer-events", "none");
					document.addEventListener('mousemove', move);
					document.addEventListener('touchmove', move, { passive: false });
					document.addEventListener('mouseup', end);
					document.addEventListener('touchend', end);
				};

				const move = (e) => {
					let ev = e.type.includes('mouse') ? e : e.touches[0];
					let dx = ev.clientX - startX;
					let dy = ev.clientY - startY;
					if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isMoving = true;
					if (isMoving) {
						e.preventDefault();
						this.keepInBounds(initialX + dx, initialY + dy);
					}
				};

				const end = () => {
					document.removeEventListener('mousemove', move);
					document.removeEventListener('touchmove', move);
					UI.elm.dash.find("iframe").css("pointer-events", "auto");
					if (!isMoving) {
						UI.closeDash();
						$(btn).css({ top: 'auto', bottom: '50%', left: 'auto', right: '20px' });
					}
				};

				btn.addEventListener('mousedown', start);
				btn.addEventListener('touchstart', start, { passive: false });
			},

			keepInBounds(x, y) {
				let btn = UI.elm.dash.find(".fab.close")[0];
				const maxX = window.innerWidth - btn.offsetWidth;
				const maxY = window.innerHeight - btn.offsetHeight;
				let tx = x !== undefined ? x : btn.getBoundingClientRect().left;
				let ty = y !== undefined ? y : btn.getBoundingClientRect().top;
				tx = Math.max(0, Math.min(maxX, tx));
				ty = Math.max(0, Math.min(maxY, ty));
				$(btn).css({ left: tx + 'px', top: ty + 'px', right: 'auto', bottom: 'auto' });
			}
		};

		$(document).ready(() => {
			Event.init();
			Core.init();
		});
	</script>
</body>

</html>
