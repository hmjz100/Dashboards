name: 同步面板

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  sync:
    name: "Sync Dashboards"
    if: github.repository_owner == 'hmjz100'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 同步 Yet Another Clash Dashboard Classic
        run: |
          TARGET_DIR="dash/hmjz100/Yet-Another-Clash-Dashboard"
          REPO_URL="https://github.com/hmjz100/Yacd-Meta-Classic.git"

          rm -rf "$TARGET_DIR"
          git clone --single-branch -b gh-pages --depth 1 "$REPO_URL" "$TARGET_DIR"
          rm -rf "$TARGET_DIR/.git"

          git add "$TARGET_DIR"
          if ! git diff --cached --quiet -- "$TARGET_DIR"; then
            HASH=$(git ls-remote "$REPO_URL" HEAD | awk '{print substr($1,1,7)}')
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

            # 如果是第一次写入 COMMIT_MSG，初始化它
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="- 同步 Yet Another Clash Dashboard Classic (${HASH})"
            else
              COMMIT_MSG="${COMMIT_MSG}"$'\n'"- 同步 Yet Another Clash Dashboard Classic (${HASH})"
            fi
            echo "COMMIT_MSG<<EOF" >> "$GITHUB_ENV"
            echo "$COMMIT_MSG" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: 同步 MetaCubeX Dashboard (metacubexd)
        run: |
          TARGET_DIR="dash/MetaCubeX/Dashboard"
          REPO_URL="https://github.com/MetaCubeX/metacubexd.git"

          rm -rf "$TARGET_DIR"
          git clone --single-branch -b gh-pages --depth 1 "$REPO_URL" "$TARGET_DIR"
          rm -rf "$TARGET_DIR/.git"

          git add "$TARGET_DIR"
          if ! git diff --cached --quiet -- "$TARGET_DIR"; then
            HASH=$(git ls-remote "$REPO_URL" HEAD | awk '{print substr($1,1,7)}')
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="- 同步 MetaCubeX Dashboard (metacubexd) (${HASH})"
            else
              COMMIT_MSG="${COMMIT_MSG}"$'\n'"- 同步 MetaCubeX Dashboard (metacubexd) (${HASH})"
            fi
            echo "COMMIT_MSG<<EOF" >> "$GITHUB_ENV"
            echo "$COMMIT_MSG" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: 同步 MetaCubeX Yet Another Clash Dashboard (yacd-meta)
        run: |
          TARGET_DIR="dash/MetaCubeX/Yet-Another-Clash-Dashboard"
          REPO_URL="https://github.com/MetaCubeX/yacd-meta.git"

          rm -rf "$TARGET_DIR"
          git clone --single-branch -b gh-pages --depth 1 "$REPO_URL" "$TARGET_DIR"
          rm -rf "$TARGET_DIR/.git"

          git add "$TARGET_DIR"
          if ! git diff --cached --quiet -- "$TARGET_DIR"; then
            HASH=$(git ls-remote "$REPO_URL" HEAD | awk '{print substr($1,1,7)}')
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="- 同步 MetaCubeX Yet Another Clash Dashboard (yacd-meta) (${HASH})"
            else
              COMMIT_MSG="${COMMIT_MSG}"$'\n'"- 同步 MetaCubeX Yet Another Clash Dashboard (yacd-meta) (${HASH})"
            fi
            echo "COMMIT_MSG<<EOF" >> "$GITHUB_ENV"
            echo "$COMMIT_MSG" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: 提交并推送变更
        if: env.HAS_CHANGES == 'true'
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新：同步上游面板" -m "$TIMESTAMP" -m "$COMMIT_MSG"
          git push
